services:

  # -------------------------
  # ZOOKEEPER + KAFKA
  # -------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # -------------------------
  # MONGODB (FACT + DIM TABLES)
  # -------------------------
  mongo:
    image: mongo:4.4
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # -------------------------
  # HDFS
  # -------------------------
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=realtime-bda
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - namenode_data:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    depends_on:
      - namenode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    ports:
      - "9864:9864"
    volumes:
      - datanode_data:/hadoop/dfs/data

  # -------------------------
  # SPARK
  # -------------------------
  spark-master:
    image: apache/spark:3.4.2
    container_name: spark-master
    environment:
      - SPARK_MODE=master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8082:8080"
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./spark/jars:/opt/extra-jars

  spark-worker:
    image: apache/spark:3.4.2
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./spark/jars:/opt/extra-jars

  # -------------------------
  # AIRFLOW BACKEND
  # -------------------------
  postgres-airflow:
    image: postgres:16-alpine
    container_name: postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  airflow-webserver:
    build: ./airflow
    container_name: airflow-webserver
    depends_on:
      - postgres-airflow
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts        # 👈 new line
      - ./data:/opt/airflow/data              # 👈 new line
      - ./archive:/opt/airflow/archive        # 👈 new line
      - /var/run/docker.sock:/var/run/docker.sock
    command: webserver

  airflow-scheduler:
    build: ./airflow
    container_name: airflow-scheduler
    depends_on:
      - airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts        # 👈 new line
      - ./data:/opt/airflow/data              # 👈 new line
      - ./archive:/opt/airflow/archive        # 👈 new line
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler

  # -------------------------
  # POSTGRES (SERVING DB FOR DASHBOARD / KPIs)
  # -------------------------
  postgres-serving:
    image: postgres:16-alpine
    container_name: postgres-serving
    environment:
      POSTGRES_USER: serving
      POSTGRES_PASSWORD: serving
      POSTGRES_DB: serving
    ports:
      - "5433:5432"
    volumes:
      - postgres_serving_data:/var/lib/postgresql/data

  # -------------------------
  # METABASE (DASHBOARD)
  # -------------------------
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - postgres-serving

  kafka-consumer:
    build: ./consumer
    container_name: kafka-consumer
    depends_on:
      - kafka
      - mongo
    restart: always

  kafka-producer:
    image: python:3.10
    container_name: kafka-producer
    working_dir: /app
    volumes:
      - ./generator:/app/generator
    command: bash -c "pip install kafka-python numpy && python /app/generator/cart_events_producer.py"
    depends_on:
      - kafka



# -------------------------
# VOLUMES
# -------------------------
volumes:
  mongo_data:
  namenode_data:
  datanode_data:
  postgres_serving_data:












